aid: apphive
name: Apphive
description: >-
  Apphive is a no-code, AI-assisted platform for building native iOS and Android
  mobile applications without writing code. A visual drag-and-drop editor with
  live phone previews lets makers assemble screens and app logic, add native
  device capabilities (GPS and maps, push notifications, camera, authentication,
  databases, in-app purchases), connect third-party APIs and payment gateways
  such as Stripe and Openpay, and then compile and publish finished apps to the
  Apple App Store and Google Play. Vertical marketplace templates cover delivery,
  taxi, e-commerce, real estate, gym management, and more. Apphive is backed by
  500 Global. This profile is maintained in the API Evangelist network.
